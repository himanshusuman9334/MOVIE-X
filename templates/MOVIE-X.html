
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MOVIE-X</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>


:root {
    --red: #C81E2C;
    --red-dark: #8E1420;
    --bg: #FFFFFF;
    --ink: #1A1A1A;
    --ink-dim: #6B6B6B;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', system-ui, sans-serif;
}

/* SAME LAYOUT AS HOMEPAGE 1 */

main {
    max-width: 920px;
    margin: 0 auto;
    padding: 100px 24px 100px;
    text-align: center;
}

/* LOGO */

.logo {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 9vw, 5.5rem);
    letter-spacing: 0.08em;
    color: var(--ink);
    margin-bottom: 0;
    text-decoration: none;
    transition: 0.25s ease;
}

.logo span {
    color: var(--red);
}

.logo:hover {
    transform: scale(1.05);
}

/* TAGLINE */

.tagline {
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin: 12px 0 50px;
}

/* SEARCH FORM */

form {
    display: flex;
    justify-content: center;
    max-width: 550px;
    margin: 0 auto 60px;

    background: #FAFAFA;
    border: 2px solid var(--red);
    border-radius: 12px;
    overflow: hidden;

    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

form:focus-within {
    border-color: var(--red-dark);
}

/* INPUT */

input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--ink);

    font-family: inherit;
    font-size: 1rem;
    padding: 18px 22px;
    outline: none;
}

input[type="text"]::placeholder {
    color: var(--ink-dim);
}

/* BUTTON */

button.go {
    background: var(--red);
    color: white;
    border: none;
    font-weight: 700;
    padding: 0 30px;

    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;

    letter-spacing: 0.04em;
    transition: 0.25s ease;
}

button.go:hover {
    background: var(--red-dark);
}

/* MOBILE */

@media (max-width: 520px) {
    main {
        padding: 70px 18px 80px;
    }

    form {
        flex-direction: column;
        border-radius: 12px;
    }

    button.go {
        padding: 16px 0;
    }
}

</style>
</head>

<body>

<main>

    <a href="/" class="logo">
    MOVIE<span>-X</span>
</a>

    <div class="tagline">
        Search a movie to see what to watch next
    </div>

    <form action="/recommend" method="POST">
      <input type="hidden" name="theme" value="light">

        <input
            type="text"
            name="movie"
            placeholder="Search a movie..."
            autocomplete="off"
            required
        >

        <button type="submit" class="go">
            Recommend
        </button>

    </form>

</main>

</body>
</html>
