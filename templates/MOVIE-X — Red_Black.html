
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVIE-X</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>



:root {
    --dark-crimson: #8B1025;
    --accent-red: #E32645;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            ellipse at 50% 0%,
            #E32645 0%,
            transparent 65%
        ),
        linear-gradient(
            135deg,
            #8B1025,
            #570817,
            #8B1025
        );

    color: white;
    font-family: 'Work Sans', system-ui, sans-serif;
}

/* MAIN SECTION */

main {
    max-width: 920px;
    margin: 0 auto;
    padding: 100px 24px 100px;
    text-align: center;
}

/* LOGO */

.logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 9vw, 5.5rem);
    letter-spacing: 0.08em;
    color: white;

    text-shadow:
        0 0 15px rgba(227, 38, 69, 0.8),
        0 0 40px rgba(227, 38, 69, 0.5);
}

.logo span {
    color: var(--accent-red);
}

/* TAGLINE */

.tagline {
    color: #FFFFFF;
    font-size: 1rem;
    margin: 12px 0 50px;
    letter-spacing: 0.04em;
}

/* SEARCH FORM */

form {
    display: flex;
    justify-content: center;
    max-width: 550px;
    margin: 0 auto 60px;

    background: var(--dark-crimson);
    border: 2px solid var(--accent-red);
    border-radius: 12px;
    overflow: hidden;

    box-shadow:
        0 0 20px rgba(227, 38, 69, 0.4),
        0 15px 40px rgba(0, 0, 0, 0.3);

    transition: 0.3s ease;
}

form:focus-within {
    box-shadow:
        0 0 30px rgba(227, 38, 69, 0.7),
        0 15px 40px rgba(0, 0, 0, 0.3);
}

/* INPUT */

input[type="text"] {
    flex: 1;
    min-width: 0;

    border: none;
    background: transparent;
    color: white;

    font-family: inherit;
    font-size: 1rem;

    padding: 19px 22px;
    outline: none;
}

input[type="text"]::placeholder {
    color: #FFD6DE;
}

/* BUTTON */

button.go {
    background: var(--accent-red);
    color: white;

    border: none;
    font-weight: 700;

    padding: 0 32px;
    cursor: pointer;

    font-family: inherit;
    font-size: 1rem;

    letter-spacing: 0.04em;
    transition: 0.25s ease;
}

button.go:hover {
    background: #FF3658;

    box-shadow:
        0 0 25px rgba(227, 38, 69, 0.8);
}

/* MOBILE */

@media (max-width: 520px) {

    main {
        padding: 70px 18px 80px;
    }

    form {
        flex-direction: column;
        border-radius: 12px;
    }

    button.go {
        padding: 16px 0;
    }
}

</style>

</head>

<body>

<main>


<a href="/2" class="logo">
    MOVIE<span>-X</span>
</a>
    <div class="tagline">
        Search a movie to see what to watch next
    </div>

    <form action="/recommend" method="POST">
      <input type="hidden" name="theme" value="dark">

        <input
            type="text"
            name="movie"
            placeholder="Search a movie..."
            autocomplete="off"
            required
        >

        <button type="submit" class="go">
            Search
        </button>

    </form>

    <p style="color:#A88E8E; font-size:0.85rem;">
        Discover your next favourite movie.
    </p>

</main>

</body>
</html>
